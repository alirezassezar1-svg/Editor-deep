    </div>
    <div class="divider"></div>
    <div class="card">
      <div class="card-title">Danger Zone</div>
      <div class="stack" style="margin-top:14px">
        <button class="btn danger block" id="resetAll">Reset All Projects</button>
      </div>
    </div>
  `;
  $('#expJson').onclick = exportProjectJSON;
  $('#expZip').onclick = exportProjectZIP;
  $('#expSql').onclick = () => {
    if (!STATE.project){ toast('No project', 'warn'); return; }
    const pg = STATE.project.providerId !== 'local';
    const sql = SQLGen.migrationSQL(STATE.project, pg);
    downloadBlob(new Blob([sql], { type:'text/plain' }), (STATE.project.name||'schema').replace(/\s+/g,'-') + '.sql');
  };
  $('#expOpenapi').onclick = () => {
    if (!STATE.project){ toast('No project', 'warn'); return; }
    downloadJSON(generateAPISpec(STATE.project).openapi, 'openapi.json');
  };
  $('#expData').onclick = async () => {
    if (!STATE.project){ toast('No project', 'warn'); return; }
    const out = {};
    for (const t of STATE.project.schema.tables){
      const r = (await IDB.get('records', t.id)) || { data: [] };
      out[t.name] = r.data;
    }
    downloadJSON(out, 'records.json');
  };
  $('#impJson').onclick = () => $('#fileJson').click();
  $('#impSql').onclick = () => $('#fileSql').click();
  $('#fileJson').onchange = async (e) => {
    const f = e.target.files[0]; if (!f) return;
    const text = await f.text();
    const data = safeJSON(text, null);
    if (!data){ toast('Invalid JSON', 'err'); return; }
    importProject(data);
    e.target.value = '';
  };
  $('#fileSql').onchange = async (e) => {
    const f = e.target.files[0]; if (!f) return;
    const text = await f.text();
    importSQL(text);
    e.target.value = '';
  };
  $('#resetAll').onclick = async () => {
    if (!confirm('Delete ALL projects? This cannot be undone.')) return;
    const all = await IDB.all('projects');
    for (const p of all) await IDB.del('projects', p.id);
    const recs = await IDB.all('records');
    for (const r of recs) await IDB.del('records', r.tableId);
    STATE.project = null;
    logActivity('Reset all projects');
    toast('All projects cleared', 'ok');
    renderAll();
  };
}

function exportProjectJSON(){
  if (!STATE.project){ toast('No project', 'warn'); return; }
  const data = clone(STATE.project);
  downloadJSON(data, (STATE.project.name||'project').replace(/\s+/g,'-') + '.json');
}

async function exportProjectZIP(){
  if (!STATE.project){ toast('No project', 'warn'); return; }
  const files = [
    { path:'project.json', data: JSON.stringify(STATE.project, null, 2) },
    { path:'schema.json', data: JSON.stringify(STATE.project.schema, null, 2) },
    { path:'migrations.sql', data: SQLGen.migrationSQL(STATE.project, STATE.project.providerId !== 'local') },
    { path:'openapi.json', data: JSON.stringify(generateAPISpec(STATE.project).openapi, null, 2) }
  ];
  const records = {};
  for (const t of STATE.project.schema.tables){
    const r = (await IDB.get('records', t.id)) || { data: [] };
    records[t.name] = r.data;
  }
  files.push({ path:'data/records.json', data: JSON.stringify(records, null, 2) });
  const zip = buildZIP(files.map(f => ({ path: f.path, data: new TextEncoder().encode(f.data) })));
  downloadBlob(zip, (STATE.project.name||'project').replace(/\s+/g,'-') + '.zip');
}

function importProject(data){
  if (!data || typeof data !== 'object'){ toast('Invalid project data', 'err'); return; }
  STATE.project = Object.assign(defaultProject(), data);
  STATE.project.id = uid('prj');
  STATE.project.updatedAt = nowISO();
  IDB.put('projects', clone(STATE.project));
  logActivity('Imported project');
  toast('Imported', 'ok');
  renderAll();
}

function importSQL(sql){
  const tableRegex = /CREATE\s+TABLE\s+(?:IF\s+NOT\s+EXISTS\s+)?"?(\w+)"?\s*\(([\s\S]*?)\);/gi;
  const tables = [];
  let m;
  while ((m = tableRegex.exec(sql)) !== null){
    const tname = m[1], body = m[2];
    const cols = [];
    body.split(',').forEach(raw => {
      const line = raw.trim();
      if (!line) return;
      if (/^(PRIMARY|FOREIGN|UNIQUE|CONSTRAINT|CHECK|INDEX)/i.test(line)) return;
      const parts = line.split(/\s+/);
      if (parts.length < 2) return;
      const cname = parts[0].replace(/"/g,'');
      let ctype = parts[1].replace(/\([^)]*\)/,'').toUpperCase();
      const lenMatch = line.match(/\(([^)]+)\)/);
      const length = lenMatch ? lenMatch[1] : '';
      const primaryKey = /PRIMARY\s+KEY/i.test(line);
      const nullable = !/NOT\s+NULL/i.test(line) && !primaryKey;
      const unique = /UNIQUE/i.test(line);
      const defMatch = line.match(/DEFAULT\s+([^,\s]+)/i);
      const def = defMatch ? defMatch[1].replace(/['"]/g,'') : null;
      const fkMatch = line.match(/REFERENCES\s+"?(\w+)"?\s*\("?(\w+)"?\)/i);
      const fk = fkMatch ? { table: fkMatch[1], column: fkMatch[2], onDelete:'NO ACTION' } : null;
      const typeMap = { INT:'INTEGER', INTEGER:'INTEGER', BIGINT:'BIGINT', BOOLEAN:'BOOLEAN', BOOL:'BOOLEAN', TEXT:'TEXT', VARCHAR:'VARCHAR', CHAR:'CHAR', UUID:'UUID', TIMESTAMP:'TIMESTAMP', DATETIME:'TIMESTAMP', DATE:'DATE', TIME:'TIME', JSON:'JSON', JSONB:'JSONB', DECIMAL:'DECIMAL', NUMERIC:'DECIMAL', FLOAT:'FLOAT', DOUBLE:'DOUBLE', BYTEA:'BLOB', BLOB:'BLOB' };
      ctype = typeMap[ctype] || 'TEXT';
      cols.push(mkCol(cname, ctype, { length, primaryKey, nullable, unique, default:def, foreignKey:fk }));
    });
    tables.push(mkTable(tname, cols));
  }
  if (!tables.length){ toast('No CREATE TABLE found', 'err'); return; }
  if (!STATE.project) STATE.project = defaultProject();
  STATE.project.schema.tables = tables;
  autoLayout();
  Migrations.generate(STATE.project);
  persistProject();
  logActivity('Imported SQL: ' + tables.length + ' tables');
  toast('Imported ' + tables.length + ' table(s)', 'ok');
  renderAll();
  switchView('designer');
}

/* ============================================================
   FILE HELPERS
   ============================================================ */
function downloadBlob(blob, name){
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = name;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
}
function downloadJSON(data, name){
  downloadBlob(new Blob([JSON.stringify(data, null, 2)], { type:'application/json' }), name);
}

/* ============================================================
   ZIP BUILDER
   ============================================================ */
const CRC32 = (() => {
  const t = new Uint32Array(256);
  for (let n = 0; n < 256; n++){ let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; }
  return (buf) => { let c = 0xFFFFFFFF; for (let i = 0; i < buf.length; i++) c = t[(c ^ buf[i]) & 0xFF] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; };
})();

function buildZIP(files){
  const enc = new TextEncoder();
  const chunks = [], central = [];
  let offset = 0;
  const now = new Date();
  const dosTime = ((now.getHours()<<11)|(now.getMinutes()<<5)|(now.getSeconds()>>1)) & 0xFFFF;
  const dosDate = (((now.getFullYear()-1980)<<9)|((now.getMonth()+1)<<5)|now.getDate()) & 0xFFFF;
  for (const f of files){
    const nameBytes = enc.encode(f.path);
    const data = f.data;
    const crc = CRC32(data);
    const local = new Uint8Array(30 + nameBytes.length);
    const lv = new DataView(local.buffer);
    lv.setUint32(0, 0x04034b50, true);
    lv.setUint16(4, 20, true);
    lv.setUint16(6, 0x0800, true);
    lv.setUint16(8, 0, true);
    lv.setUint16(10, dosTime, true);
    lv.setUint16(12, dosDate, true);
    lv.setUint32(14, crc, true);
    lv.setUint32(18, data.length, true);
    lv.setUint32(22, data.length, true);
    lv.setUint16(26, nameBytes.length, true);
    lv.setUint16(28, 0, true);
    local.set(nameBytes, 30);
    chunks.push(local, data);
    const cd = new Uint8Array(46 + nameBytes.length);
    const cv = new DataView(cd.buffer);
    cv.setUint32(0, 0x02014b50, true);
    cv.setUint16(4, 20, true);
    cv.setUint16(6, 20, true);
    cv.setUint16(8, 0x0800, true);
    cv.setUint16(10, 0, true);
    cv.setUint16(12, dosTime, true);
    cv.setUint16(14, dosDate, true);
    cv.setUint32(16, crc, true);
    cv.setUint32(20, data.length, true);
    cv.setUint32(24, data.length, true);
    cv.setUint16(28, nameBytes.length, true);
    cv.setUint32(42, offset, true);
    cd.set(nameBytes, 46);
    central.push(cd);
    offset += local.length + data.length;
  }
  const cdSize = central.reduce((s,c) => s + c.length, 0);
  const end = new Uint8Array(22);
  const ev = new DataView(end.buffer);
  ev.setUint32(0, 0x06054b50, true);
  ev.setUint16(8, files.length, true);
  ev.setUint16(10, files.length, true);
  ev.setUint32(12, cdSize, true);
  ev.setUint32(16, offset, true);
  return new Blob([...chunks, ...central, end], { type:'application/zip' });
}

/* ============================================================
   INIT
   ============================================================ */
function initApp(){
  initTheme();

  // Sidenav nav
  $('#sidenav').onclick = (e) => {
    const b = e.target.closest('[data-view]');
    if (!b) return;
    switchView(b.dataset.view);
    closeSidenavDrawer();
    closeInspector();
  };

  // Mobile nav
  $('#mobileNav').onclick = (e) => {
    const b = e.target.closest('button[data-view]');
    if (!b) return;
    if (b.dataset.view === '__cmd'){ openCmdk(); return; }
    switchView(b.dataset.view);
  };

  // Toggle sidebar — desktop collapses, mobile opens drawer
  $('#btnToggleNav').onclick = () => {
    const isMobile = window.matchMedia('(max-width:1023px)').matches;
    if (isMobile){
      const open = $('#sidenav').classList.toggle('open');
      $('#sidenavBackdrop').classList.toggle('on', open);
    } else {
      $('#app').classList.toggle('collapsed');
    }
  };

  // Backdrop closes drawer
  $('#sidenavBackdrop').onclick = closeSidenavDrawer;
  function closeSidenavDrawer(){
    $('#sidenav').classList.remove('open');
    $('#sidenavBackdrop').classList.remove('on');
  }

  // Theme
  $('#btnTheme').onclick = toggleTheme;

  // Cmdk
  $('#btnCmd').onclick = openCmdk;
  $('#cmdk').onclick = (e) => { if (e.target.id === 'cmdk') closeCmdk(); };
  $('#cmdkInput').oninput = (e) => { cmdIndex = 0; renderCmd(e.target.value); };
  $('#cmdkInput').onkeydown = (e) => {
    if (e.key === 'ArrowDown'){ e.preventDefault(); cmdIndex = Math.min(cmdIndex+1, cmdFiltered.length-1); renderCmd(e.target.value); }
    else if (e.key === 'ArrowUp'){ e.preventDefault(); cmdIndex = Math.max(cmdIndex-1, 0); renderCmd(e.target.value); }
    else if (e.key === 'Enter'){ e.preventDefault(); const c = cmdFiltered[cmdIndex]; if (c){ closeCmdk(); setTimeout(c.run, 60); } }
    else if (e.key === 'Escape') closeCmdk();
  };
  $('#cmdkList').onclick = (e) => {
    const b = e.target.closest('[data-cmd]');
    if (!b) return;
    const c = COMMANDS.find(x => x.id === b.dataset.cmd);
    if (c){ closeCmdk(); setTimeout(c.run, 60); }
  };

  // Modal
  $('#modalClose').onclick = Modal.close;
  $('#scrim').onclick = Modal.close;

  // Inspector
  $('#btnInspectorClose').onclick = closeInspector;

  // Designer toolbar
  $('#btnAddTable').onclick = addTableDialog;
  $('#btnTemplates').onclick = showTemplatesModal;
  $('#btnAutoLayout').onclick = () => { if (!STATE.project){ toast('No project','warn'); return; } autoLayout(); renderDesigner(); persistProject(); toast('Applied', 'ok'); };
  $('#btnFit').onclick = fitCanvas;
  $('#btnZoomIn').onclick = () => setZoom(STATE.zoom * 1.15);
  $('#btnZoomOut').onclick = () => setZoom(STATE.zoom * 0.85);

  // Project pill
  $('#projectPill').onclick = () => {
    if (!STATE.project){ startNewProject('local'); return; }
    switchView('home');
  };

  // Global keys
  document.addEventListener('keydown', (e) => {
    const isMod = e.metaKey || e.ctrlKey;
    if (isMod && e.key.toLowerCase() === 'k'){ e.preventDefault(); openCmdk(); return; }
    if (e.key === 'Escape'){
      if ($('#cmdk').classList.contains('on')) return closeCmdk();
      if ($('#modalWrap').classList.contains('on')) return Modal.close();
      if ($('#sidenav').classList.contains('open')) return closeSidenavDrawer();
      return closeInspector();
    }
  });

  // Media query: close inspector when going desktop
  window.matchMedia('(max-width: 1023px)').addEventListener('change', (e) => { if (!e.matches) closeInspector(); });

  // Load project
  (async () => {
    try {
      const all = await IDB.all('projects');
      if (all && all.length){ STATE.project = all[all.length - 1]; logActivity('Restored project'); }
    } catch(e){}
    renderAll();
    setupCanvasPanZoom();
    if (STATE.project) renderDesigner();
  })();
}

function showTemplatesModal(){
  Modal.open({
    title: 'Load Template',
    sub: 'Replaces current schema',
    body: `<div class="template-grid">${Object.entries(TEMPLATES).map(([k,t]) => `
      <button class="template" data-tpl="${k}"><div class="template-name">${esc(t.name)}</div><div class="template-desc">${esc(t.desc)}</div></button>
    `).join('')}</div>`,
    foot: `<button class="btn ghost" onclick="Modal.close()">Cancel</button>`,
    onMount(){
      $$('.template', $('#modalBody')).forEach(b => b.onclick = () => { Modal.close(); startProjectFromTemplate(b.dataset.tpl); });
    }
  });
}
